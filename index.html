<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>arranging-the-widths.html</title>
    <link rel="stylesheet" href="arranging-the-widths.css">
</head>

<body>
    <form>
        <fieldset>
            <legend>Rent Audi Vehicles</legend>

            <label for="name">Named</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label for="car-select">Select</label>
            <select id="car-select">
                <option>Audi 80</option>
                <option>Audi A4</option>
                <option>Audi A6</option>
            </select>

            <label>Select</label>

            <label for="message">Message:</label>
            <textarea id="message"></textarea>
        </fieldset>
    </form>
</body>

</html>
